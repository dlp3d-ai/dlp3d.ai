name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'pages-preview-*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/tags/pages-preview-')
    runs-on: ubuntu-latest
    env:
      DEPLOY_TARGET: github-pages
      NEXT_PUBLIC_DEPLOY_TARGET: github-pages
      NEXT_PUBLIC_SITE_BASE_PATH: /dlp3d.ai
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_ORCHESTRATOR_HOST: u1-api.sensenova.cn
      NEXT_PUBLIC_ORCHESTRATOR_PORT: 443
      NEXT_PUBLIC_ORCHESTRATOR_PATH_PREFIX: /dlp3d-ai/orchestrator
      NEXT_PUBLIC_BACKEND_HOST: u1-api.sensenova.cn
      NEXT_PUBLIC_BACKEND_PORT: 443
      NEXT_PUBLIC_BACKEND_PATH_PREFIX: /dlp3d-ai/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable API routes for static export
        run: |
          mkdir -p /tmp/dlp3d-disabled-api
          mv app/api/LLM /tmp/dlp3d-disabled-api/LLM

      - name: Build static site
        run: pnpm run build

      - name: Rewrite CSS asset paths
        run: node scripts/rewrite-pages-css.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
